[project]
name = "tice"
version = "0.1.0"
description = "Reliability envelopes for tabular models under distribution shift, and the calibration confound in threshold-based robustness metrics"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [
    { name = "Neslihan Aytac", email = "neslihanaytac@topkapi.edu.tr" },
    { name = "Bedirhan Bedir", email = "bedirhanbedir@topkapi.edu.tr" },
]
dependencies = [
    "numpy>=1.24",
    "pandas>=2.0",
    "scikit-learn>=1.3",
    "scipy>=1.10",
    "pyyaml>=6.0",
]

# Heavy / optional model backends. The smoke config never needs these; the
# model runner imports them lazily and records status="skipped" when absent.
[project.optional-dependencies]
gbdt = ["xgboost>=2.0", "catboost>=1.2"]
icl = ["tabpfn>=2.0", "tabpfn-client>=0.1", "tabicl>=0.1"]
dev = ["pytest>=7.0", "ruff>=0.4"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["tice*"]

[tool.pytest.ini_options]
# Make `tice` importable under both `pytest` and `uv run pytest` without an
# editable install, and keep tests fast.
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]  # long lines tolerated in tables/docstrings
