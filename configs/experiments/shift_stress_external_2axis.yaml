# External-validation FULL config (2 axes, 1 seed). Run via:
#   TABPFN_TOKEN=<key> python experiments/run_external_shift.py --config configs/experiments/shift_stress_external_2axis.yaml
# 44 usable OpenML datasets x 2 axes x 6 lambda x 6 models x 1 seed.
# tabpfn_client needs the PriorLabs cloud token; without it that model is cleanly
# recorded status="skipped" and excluded (the other 5 still run). Writes to
# results/external/tables_2axis_seed42/ (canonical results untouched).
#
# NOTE: covariate_shift is a no-op on all-categorical datasets (no numeric columns),
# so those datasets' covariate envelope is trivially max -- see results/external/README.md.
seed: 42
output_dir: results/external/tables_2axis_seed42

datasets:
  - kr-vs-kp
  - breast-w
  - mfeat-fourier
  - mfeat-karhunen
  - mfeat-morphological
  - mfeat-zernike
  - mfeat-factors
  - cmc
  - credit-approval
  - credit-g
  - diabetes
  - tic-tac-toe
  - vehicle
  - spambase
  - analcatdata_authorship
  - pc4
  - pc3
  - kc1
  - pc1
  - ilpd
  - qsar-biodeg
  - wdbc
  - ozone-level-8hr
  - phoneme
  - steel-plates-fault
  - wall-robot-navigation
  - cnae-9
  - first-order-theorem-proving
  - churn
  - texture
  - optdigits
  - pendigits
  - satimage
  - segment
  - vowel
  - climate-model-simulation-crashes
  - car
  - dna
  - splice
  - eucalyptus
  - PhishingWebsites
  - GesturePhaseSegmentation
  - MiceProtein
  - dresses-sales

models:
  - logreg
  - hist_gbdt
  - xgboost
  - catboost
  - tabpfn_client
  - tabicl

shift_axes:
  - label_noise
  - covariate_shift

lambda_values: [0.00, 0.05, 0.10, 0.20, 0.30, 0.40]

test_size: 0.3
ece_bins: 15
thresholds:
  tau_utility: 0.03
  tau_ece: 0.10
  tau_nll: 0.75
gbdt_reference: clean
gbdt_reference_models:
  - xgboost
  - catboost
max_context_rows: 1000
