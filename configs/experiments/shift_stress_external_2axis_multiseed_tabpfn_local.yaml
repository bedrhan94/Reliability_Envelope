# TabPFN across three seeds using LOCAL weights instead of the cloud client.
#
# The cloud arm kept stalling on the PriorLabs daily cell-prediction quota (HTTP 429),
# which capped it at 844 of 1584 conditions on the first attempt and 1011 on the second.
# The `tabpfn` package runs the same model from downloaded weights on the local GPU: no
# quota, no per-condition network round trip, and -- the reason this matters for the
# paper -- a pinnable model version, which removes the reproducibility limitation we had
# to state for the cloud backend.
#
# Requires TABPFN_TOKEN for the one-time (free) licence acceptance that unlocks the
# weight download; after that the run is offline.
seed: 42
seeds: [42, 1337, 2025]
output_dir: results/external/tables_2axis_multiseed_tabpfn_local

datasets:
  - kr-vs-kp
  - breast-w
  - mfeat-fourier
  - mfeat-karhunen
  - mfeat-morphological
  - mfeat-zernike
  - mfeat-factors
  - cmc
  - credit-approval
  - credit-g
  - diabetes
  - tic-tac-toe
  - vehicle
  - spambase
  - analcatdata_authorship
  - pc4
  - pc3
  - kc1
  - pc1
  - ilpd
  - qsar-biodeg
  - wdbc
  - ozone-level-8hr
  - phoneme
  - steel-plates-fault
  - wall-robot-navigation
  - cnae-9
  - first-order-theorem-proving
  - churn
  - texture
  - optdigits
  - pendigits
  - satimage
  - segment
  - vowel
  - climate-model-simulation-crashes
  - car
  - dna
  - splice
  - eucalyptus
  - PhishingWebsites
  - GesturePhaseSegmentation
  - MiceProtein
  - dresses-sales

models:
  - tabpfn

shift_axes:
  - label_noise
  - covariate_shift

lambda_values: [0.00, 0.05, 0.10, 0.20, 0.30, 0.40]

test_size: 0.3
ece_bins: 15
thresholds:
  tau_utility: 0.03
  tau_ece: 0.10
  tau_nll: 0.75
gbdt_reference: clean
gbdt_reference_models:
  - xgboost
  - catboost
max_context_rows: 10000
