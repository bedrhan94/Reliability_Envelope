# Primary external benchmark, MULTI-SEED (Reviewer 2, 4.1).
# The reviewer's first priority: the 44-dataset primary result was single-seed, and the
# 3-seed evidence came from a 12-dataset outcome-selected subset that cannot stand in for
# it. This runs the full benchmark at three seeds.
#
# Two other things are folded in so this is one run rather than three:
#   * max_context_rows is 10000, i.e. uncapped for every split here (max train ~7738), so
#     the ICL models see what the baselines see -- the correction of section 5.4 applied
#     from the start rather than merged in afterwards.
#   * the run carries the new calibration columns (Brier, adaptive and classwise ECE,
#     calibration slope/intercept), which answer 4.7 and did not exist when seed 42 was
#     first run -- so seed 42 is re-run rather than reused.
#
# 44 datasets x 2 axes x 6 lambda x 6 models x 3 seeds = 9504 conditions.
# Run: python experiments/run_external_multiseed.py #        --config configs/experiments/shift_stress_external_2axis_multiseed_primary.yaml
seed: 42
seeds: [42, 1337, 2025]
output_dir: results/external/tables_2axis_multiseed_primary

datasets:
  - kr-vs-kp
  - breast-w
  - mfeat-fourier
  - mfeat-karhunen
  - mfeat-morphological
  - mfeat-zernike
  - mfeat-factors
  - cmc
  - credit-approval
  - credit-g
  - diabetes
  - tic-tac-toe
  - vehicle
  - spambase
  - analcatdata_authorship
  - pc4
  - pc3
  - kc1
  - pc1
  - ilpd
  - qsar-biodeg
  - wdbc
  - ozone-level-8hr
  - phoneme
  - steel-plates-fault
  - wall-robot-navigation
  - cnae-9
  - first-order-theorem-proving
  - churn
  - texture
  - optdigits
  - pendigits
  - satimage
  - segment
  - vowel
  - climate-model-simulation-crashes
  - car
  - dna
  - splice
  - eucalyptus
  - PhishingWebsites
  - GesturePhaseSegmentation
  - MiceProtein
  - dresses-sales

models:
  - logreg
  - hist_gbdt
  - xgboost
  - catboost
  - tabpfn_client
  - tabicl

shift_axes:
  - label_noise
  - covariate_shift

lambda_values: [0.00, 0.05, 0.10, 0.20, 0.30, 0.40]

test_size: 0.3
ece_bins: 15
thresholds:
  tau_utility: 0.03
  tau_ece: 0.10
  tau_nll: 0.75
gbdt_reference: clean
gbdt_reference_models:
  - xgboost
  - catboost
max_context_rows: 10000
