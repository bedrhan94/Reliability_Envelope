# Smoke config: CPU-only, no downloads, sklearn toy datasets + lightweight models.
# Runs the full M1-M3 pipeline end-to-end in seconds.
seed: 42
output_dir: results/tables

datasets:
  - breast_cancer   # binary, numeric
  - wine            # 3-class, numeric
  - iris            # 3-class, numeric
  - synthetic_mixed # 3-class, real categorical features (exercises rare_category_shift)

# Lightweight, always-available models. The GBDT reference falls back to
# hist_gbdt here; the full config swaps in xgboost/catboost/tabpfn/tabicl.
models:
  - logreg
  - hist_gbdt

shift_axes:
  - label_noise
  - class_imbalance
  - missingness_shift
  - rare_category_shift
  - covariate_shift
  - context_budget

lambda_values: [0.00, 0.05, 0.10, 0.20, 0.30, 0.40]

test_size: 0.3
ece_bins: 15

thresholds:
  tau_utility: 0.03
  tau_ece: 0.10
  tau_nll: 0.75

# "clean" => fixed clean-ID GBDT bar per dataset (default reading of the spec).
# "matched" => GBDT bar recomputed at each shift severity.
gbdt_reference: clean
gbdt_reference_models:
  - xgboost
  - catboost

max_context_rows: 1000
