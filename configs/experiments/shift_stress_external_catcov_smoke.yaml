# Tier 3 #8 smoke: validate the new categorical_covariate_shift axis end-to-end on
# categorical datasets that the numeric covariate_shift skips. 2 all-categorical (car,
# tic-tac-toe) + 1 mixed (credit-approval), all 6 models, seed 42. Small, for validation
# only -- confirms the axis runs in the pipeline and produces sensible metrics (does the
# covariate calibration-collapse pattern appear on categorical inputs too?).
seed: 42
output_dir: results/external/catcov_smoke

datasets:
  - car
  - tic-tac-toe
  - credit-approval

models:
  - logreg
  - hist_gbdt
  - xgboost
  - catboost
  - tabicl
  - tabpfn

shift_axes:
  - categorical_covariate_shift

lambda_values: [0.00, 0.05, 0.10, 0.20, 0.30, 0.40]

test_size: 0.3
ece_bins: 15
thresholds:
  tau_utility: 0.03
  tau_ece: 0.10
  tau_nll: 0.75
gbdt_reference: clean
gbdt_reference_models:
  - xgboost
  - catboost
max_context_rows: 10000
