# Tier 2 #6: the strong-baseline arm at THREE seeds, to put a CI on Table XVIII's +0.0205.
# Same 5 GBDT models and equal tuning budget as the single-seed strong arm, now across
# seeds [42, 1337, 2025]. CPU-only (no ICL models here -- ICL rows are spliced from the
# multiseed primary afterwards, as in the seed-42 strong arm). This is the heaviest arm in
# the paper x3, so it runs in the background; it is resumable (per-seed checkpoints).
seed: 42
seeds: [42, 1337, 2025]
output_dir: results/external/tables_2axis_strong_baselines_multiseed

datasets:
  - kr-vs-kp
  - breast-w
  - mfeat-fourier
  - mfeat-karhunen
  - mfeat-morphological
  - mfeat-zernike
  - mfeat-factors
  - cmc
  - credit-approval
  - credit-g
  - diabetes
  - tic-tac-toe
  - vehicle
  - spambase
  - analcatdata_authorship
  - pc4
  - pc3
  - kc1
  - pc1
  - ilpd
  - qsar-biodeg
  - wdbc
  - ozone-level-8hr
  - phoneme
  - steel-plates-fault
  - wall-robot-navigation
  - cnae-9
  - first-order-theorem-proving
  - churn
  - texture
  - optdigits
  - pendigits
  - satimage
  - segment
  - vowel
  - climate-model-simulation-crashes
  - car
  - dna
  - splice
  - eucalyptus
  - PhishingWebsites
  - GesturePhaseSegmentation
  - MiceProtein
  - dresses-sales

models:
  - lightgbm
  - xgboost_tuned
  - catboost_tuned
  - lightgbm_tuned
  - gbdt_ensemble

shift_axes:
  - label_noise
  - covariate_shift

lambda_values: [0.00, 0.05, 0.10, 0.20, 0.30, 0.40]

test_size: 0.3
ece_bins: 15
thresholds:
  tau_utility: 0.03
  tau_ece: 0.10
  tau_nll: 0.75
gbdt_reference: clean
gbdt_reference_models:
  - xgboost_tuned
  - catboost_tuned
max_context_rows: 10000
